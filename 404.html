    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--cream-light);
            padding: 40px 20px;
        }
        .error-page .emoji {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .error-page h1 {
            font-family: "Playfair Display", serif;
            font-size: 64px;
            color: var(--navy);
            margin-bottom: 10px;
        }
        .error-page p {
            color: var(--text-light);
            font-size: 16px;
            margin-bottom: 30px;
        }
        .error-page .btn {
            background: var(--navy);
            color: var(--cream);
            padding: 14px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.25s ease;
        }
        .error-page .btn:hover {
            background: var(--navy-light);
            transform: translateY(-2px);
        }
        @media (max-width: 600px) {
            .error-page h1 { font-size: 42px; }
            .error-page .emoji { font-size: 60px; }
        }
    </style>
</head>
